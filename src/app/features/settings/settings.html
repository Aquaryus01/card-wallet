<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" />
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <h1 class="page-title title">Settings</h1>

  <div class="section">
    <span class="section-label">Card list</span>
    <div class="layouts">
      <button type="button" [class.on]="settings().listLayout === 'grid'" [attr.aria-pressed]="settings().listLayout === 'grid'" (click)="setListLayout('grid')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="4" y="5" width="7" height="6" rx="1.5" />
          <rect x="13" y="5" width="7" height="6" rx="1.5" />
          <rect x="4" y="13" width="7" height="6" rx="1.5" />
          <rect x="13" y="13" width="7" height="6" rx="1.5" />
        </svg>
        Grid
      </button>
      <button type="button" [class.on]="settings().listLayout === 'stack'" [attr.aria-pressed]="settings().listLayout === 'stack'" (click)="setListLayout('stack')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="4" y="4" width="16" height="6" rx="1.5" />
          <rect x="4" y="9" width="16" height="6" rx="1.5" />
          <rect x="4" y="14" width="16" height="6" rx="1.5" />
        </svg>
        Stack
      </button>
    </div>
  </div>

  <div class="section">
    <span class="section-label">In store</span>
    <ion-list class="group">
      <ion-item>
        <ion-toggle [checked]="settings().autoOpen" (ionChange)="setAutoOpen($event.detail.checked)">
          Auto-open card
          <span class="sub">When you're at a matching store</span>
        </ion-toggle>
      </ion-item>
      <ion-item>
        @if (locationOn()) {
          <ion-label>Location</ion-label>
          <ion-note slot="end" class="status"><span class="dot ok"></span>On</ion-note>
        } @else {
          <ion-label>
            Location
            <p>{{ locationText() }}</p>
          </ion-label>
          <ion-button slot="end" class="pill small" (click)="fixLocation()">{{ locationFixLabel() }}</ion-button>
        }
      </ion-item>
    </ion-list>
  </div>

  <div class="section">
    <span class="section-label">Backup</span>
    <ion-list class="group">
      <ion-item button [detail]="false" [disabled]="busy() || cardCount() === 0" (click)="exportAll()">
        <span slot="start" class="icon-square"><ion-icon name="share-outline" /></span>
        <ion-label>
          Export all cards
          <p>Zip with card data and photos</p>
        </ion-label>
      </ion-item>
      <ion-item button [detail]="false" [disabled]="busy()" (click)="pickImportFile()">
        <span slot="start" class="icon-square"><ion-icon name="download-outline" /></span>
        <ion-label>
          Import backup
          <p>Restore from a CardWallet .zip</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </div>

  <p class="footer">CardWallet</p>
  <input #fileInput type="file" accept=".zip,application/zip" hidden (change)="onFileChosen($event)" />
</ion-content>
